<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Data Diri - Tema Biru</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #021B79, #0575E6, #00d2ff);
            background-size: 300% 300%;
            animation: gradientBG 10s ease infinite;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animasi Background Bergerak */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Gelembung Cahaya di Background */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        .circle.one { width: 200px; height: 200px; top: 10%; left: 15%; }
        .circle.two { width: 300px; height: 300px; bottom: 10%; right: 10%; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-25px); }
        }

        /* Kartu Utama (Glassmorphism) */
        .profile-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 35px 30px;
            color: #ffffff;
            box-shadow: 0 20px 50px rgba(0, 15, 60, 0.4);
            animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bagian Foto & Nama */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            animation: pulseGlow 2.5s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(0, 242, 254, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #0a2540;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p.role {
            font-size: 0.9rem;
            color: #bae6fd;
            margin-top: 4px;
        }

        /* Daftar Data Diri */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .info-item {
            background: rgba(10, 37, 88, 0.35);
            border: 1px solid rgba(135, 206, 250, 0.2);
            padding: 14px;
            border-radius: 14px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .info-item:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(14, 165, 233, 0.35);
            border-color: #38bdf8;
            box-shadow: 0 8px 20px rgba(0, 180, 255, 0.25);
        }

        .info-item.full {
            grid-column: span 2;
        }

        /* Animasi Muncul Berurutan */
        .info-item:nth-child(1) { animation-delay: 0.2s; }
        .info-item:nth-child(2) { animation-delay: 0.35s; }
        .info-item:nth-child(3) { animation-delay: 0.5s; }
        .info-item:nth-child(4) { animation-delay: 0.65s; }
        .info-item:nth-child(5) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7dd3fc;
            display: block;
            margin-bottom: 4px;
        }

        .value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* Tag Hobi & Hal Favorit */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .tag {
            background: rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(125, 211, 252, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            transition: 0.25s;
        }

        .tag:hover {
            background: #0284c7;
            transform: scale(1.08);
        }

        /* Motto / Quote */
        .quote {
            text-align: center;
            font-style: italic;
            font-size: 0.85rem;
            color: #e0f2fe;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 420px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
            .info-item.full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- Elemen Dekorasi Latar Belakang -->
    <div class="circle one"></div>
    <div class="circle two"></div>

    <!-- Kartu Profil -->
    <div class="profile-card">
        <div class="header">
            <div class="avatar-wrapper">
                <!-- Ganti link gambar di bawah dengan foto profilmu -->
                <img src="havenly pic of kim jennie.jpe" alt="Foto Profil">
            </div>
            <h1>🧠🧩Anita Wijaya🙌👌</h1>
            <p class="role">Pelajar / Akuntan / Arsitek</p>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="label">🎂 Ulang Tahun</span>
                <span class="value">13 Desember 2010</span>
            </div>

            <div class="info-item">
                <span class="label">⏳ Usia</span>
                <span class="value">16 Tahun</span>
            </div>

            <div class="info-item full">
                <span class="label">📍 Domisili</span>
                <span class="value">Jakarta, Indonesia</span>
            </div>

            <div class="info-item full">
                <span class="label">🎯 Hobi</span>
                <div class="tags">
                    <span class="tag">Gambar</span>
                    <span class="tag">Baca buku</span>
                    <span class="tag">Kerjain tugas</span>
                    <span class="tag">Nonton drakor</span>
                </div>
            </div>

            <div class="info-item full">
                <span class="label">💙 Hal Favorit</span>
                <div class="tags">
                    <span class="tag">Warna Biru dan coklat</span>
                    <span class="tag">Norway,Jepang</span>
                    <span class="tag">Dimsum mentai</span>
                    <span class="tag">Langit Malam dan aurora</span>
                </div>
            </div>
        </div>

        <div class="quote">
            "Perfect bgt sih ini."
        </div>
    </div>

</body>
</html>
